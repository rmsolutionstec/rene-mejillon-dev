services:
  - type: web
    name: rene-mejillon-api
    env: php
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:clear
      php artisan route:clear
      php artisan view:clear
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /api/projects
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      # Las vars DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
      # se agregan automáticamente desde la base de datos vinculada en Render.

databases:
  - name: rene-mejillon-db
    databaseName: rene_mejillon_dev
    user: rene_mejillon_dev_user
    region: oregon
    plan: free
