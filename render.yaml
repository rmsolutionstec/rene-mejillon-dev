services:
  - type: web
    name: rene-mejillon-api
    env: php
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      composer install --no-dev --optimize-autoloader &&
      php artisan config:clear &&
      php artisan route:clear &&
      php artisan view:clear
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /api/projects
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_HOST
        fromDatabase:
          name: rene-mejillon-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rene-mejillon-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: rene-mejillon-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: rene-mejillon-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rene-mejillon-db
          property: password

databases:
  - name: rene-mejillon-db
    databaseName: rene_mejillon_dev
    user: rene_mejillon_dev_user
    region: oregon
    plan: free
