services:
  - type: web
    name: rene-mejillon-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://rene-mejillon-dev.vercel.app
      - key: APP_URL
        sync: false
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_HOST
        fromDatabase:
          name: rene-mejillon-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rene-mejillon-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: rene-mejillon-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: rene-mejillon-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rene-mejillon-db
          property: password

databases:
  - name: rene-mejillon-db
    databaseName: rene_mejillon_dev
    user: rene_mejillon_dev_user
    region: oregon
    plan: free
